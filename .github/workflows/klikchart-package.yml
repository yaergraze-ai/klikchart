name: Klikchart QA and complete source ZIP
on:
  push:
    branches: [main, ui/klikchart-v48-refinement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Export complete source ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd()
          target=Path('/tmp/klikchart-fullstack-v5.0.0-complete.zip')
          forbidden={'.git','node_modules','.vercel','.next','coverage'}
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or any(x in forbidden for x in p.relative_to(root).parts):
                      continue
                  if p.name=='.env' or p.name.startswith('.env.') and p.name!='.env.example':
                      continue
                  z.write(p,arcname=Path('klikchart')/p.relative_to(root))
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              print('ZIP entries:',len(z.namelist()),'ZIP size:',target.stat().st_size)
          PY
      - name: Upload complete source code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klikchart-fullstack-v5.0.0-complete
          path: /tmp/klikchart-fullstack-v5.0.0-complete.zip
          if-no-files-found: error
          retention-days: 30
